name: Build APK

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-terminal/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build terminal UI
        working-directory: web-terminal
        run: |
          npm ci
          npm run build

      - name: Fetch proot (Termux builds)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf
          scripts/fetch-proot.sh

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease assembleDebug

      - name: Rename
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk AgyTerminal.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk AgyTerminal-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AgyTerminal-apk
          path: AgyTerminal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AgyTerminal-debug-apk
          path: AgyTerminal-debug.apk

      # Easiest way to get the APK on a phone: the "latest" release on the repo page.
      # Needs Settings → Actions → General → Workflow permissions → "Read and write".
      # Without it the APK is still available as the run's artifact.
      - name: Publish "latest" release
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AgyTerminal.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Agy টার্মিনাল — সর্বশেষ বিল্ড" \
            --notes "ফোনে এই পেজ খুলে **AgyTerminal.apk** নামিয়ে ইনস্টল করুন। (commit ${GITHUB_SHA::7}, branch ${GITHUB_REF_NAME})"

  # Boots an emulator and runs the app's self test: download + install Ubuntu, start it
  # with proot, run the first-time setup (apt + official Antigravity installer) and
  # `agy --version`. Everything is logged under the logcat tag AgySelfTest.
  smoke-test:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: AgyTerminal-debug-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 4096
          script: bash scripts/emulator-selftest.sh AgyTerminal-debug.apk
